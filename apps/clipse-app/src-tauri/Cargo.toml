[package]
name = "clipse-app"
description = "Clipse desktop interface: tray, history window and the hotkey popup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# Windows requires. See rust-lang/cargo#8519.
name = "clipse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipse-core.workspace = true
clipse-ipc.workspace = true
# One executable: the app starts the daemon in-process rather than shipping a
# second binary for the user to notice. It still only talks to it over IPC.
clipsed.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
# `process` is not in the workspace feature set because only this crate spawns
# a child: the macOS notch sidecar.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"

# Renders the pairing offer as an SVG. A compiled-in encoder, not a network
# call: the rule this app follows is that nothing reaches out at runtime, and
# a Rust dependency does not.
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2.5.1"

[dev-dependencies]
# Only used by `examples/mock-daemon.rs` to fabricate a real PNG payload.
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[features]
# Tauri's own convention: disables devtools and enables the custom protocol.
custom-protocol = ["tauri/custom-protocol"]
