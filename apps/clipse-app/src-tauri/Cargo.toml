[package]
name = "clipse-app"
description = "Clipse desktop interface: tray, history window and the hotkey popup."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
# The `_lib` suffix keeps the library name distinct from the binary, which
# Windows requires. See rust-lang/cargo#8519.
name = "clipse_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
clipse-core.workspace = true
clipse-ipc.workspace = true

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"

[dev-dependencies]
# Only used by `examples/mock-daemon.rs` to fabricate a real PNG payload.
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile.workspace = true

[features]
# Tauri's own convention: disables devtools and enables the custom protocol.
custom-protocol = ["tauri/custom-protocol"]
