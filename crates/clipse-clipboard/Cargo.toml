[package]
name = "clipse-clipboard"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Platform clipboard capture/injection for Clipse: watch, suppress, inject."

[dependencies]
clipse-core.workspace = true
thiserror.workspace = true
tracing.workspace = true
tokio.workspace = true
# Patterns are anchored and cheap (no catastrophic-backtracking constructs) —
# this crate's detectors run on every clipboard change.
regex = "1.13"

# Windows: AddClipboardFormatListener + WM_CLIPBOARDUPDATE on a hidden
# message-only window. Not a workspace dependency because no other crate
# needs raw Win32 access.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }

# macOS: NSPasteboard polling via AppKit.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", features = ["NSPasteboard"] }

# Linux: X11 (XFIXES selection-change events) and Wayland (wlr-data-control).
#
# `x11rb` is used directly only for the XFIXES change notification. Reading and
# writing the selection goes through `x11-clipboard`, which implements the INCR
# protocol for payloads larger than a single X request — reimplementing that
# here would be a lot of subtle code for no gain.
#
# `wl-clipboard-rs` is the wlr-data-control client. Its `utils` module is also
# how we detect GNOME/Mutter, which does not implement that protocol.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
# Pinned to the same major as x11-clipboard depends on: two x11rb versions in
# the graph means two incompatible `Connection` traits, and the atoms interned
# on one connection cannot be used with the other.
x11rb = { version = "0.13", features = ["xfixes"] }
x11-clipboard = "0.9"
wl-clipboard-rs = "0.9"

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time", "test-util"] }
