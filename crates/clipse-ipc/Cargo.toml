[package]
name = "clipse-ipc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Protocol and transport between the Clipse daemon and its user interfaces."

[dependencies]
clipse-core.workspace = true
rmp-serde.workspace = true
serde.workspace = true
# So a payload response encodes as a MessagePack `bin` blob at 1:1 rather than
# as an array of integers at ~1.5x. Without it MAX_PAYLOAD_BYTES would be an
# artefact of the encoding instead of a decision about the product.
serde_bytes = "0.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
