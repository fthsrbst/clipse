[package]
name = "clipsed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Clipse background daemon: owns the clipboard, the history and the sync sessions."

[dependencies]
clipse-clipboard.workspace = true
clipse-core.workspace = true
clipse-crypto.workspace = true
clipse-ipc.workspace = true
clipse-net.workspace = true
clipse-store.workspace = true
clipse-sync.workspace = true

# Synthetic paste lives in the daemon, not the UI: "Enter pastes into the
# window you were just in" needs the same platform code on every front end, and
# there is no reason to have it twice.
enigo = "0.6"

anyhow.workspace = true
async-trait.workspace = true
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal", "fs"] }
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
clipse-ipc.workspace = true
tempfile.workspace = true

# Only for the end-to-end test, which drives the real clipboard from the test
# process so the daemon sees a genuine external copy.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
] }
