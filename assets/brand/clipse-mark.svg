<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Clipse eclipse mark</title>
  <desc id="desc">A dark eclipsed disc inside an amber corona.</desc>
  <defs>
    <linearGradient id="clipse-mark-corona" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC46B"/>
      <stop offset="1" stop-color="#C97A10"/>
    </linearGradient>
    <mask id="clipse-mark-cutout" x="0" y="0" width="512" height="512" maskUnits="userSpaceOnUse">
      <circle cx="248" cy="258" r="150" fill="#fff"/>
      <circle cx="310" cy="198" r="139" fill="#000"/>
    </mask>
  </defs>
  <circle cx="250" cy="256" r="190" fill="none" stroke="url(#clipse-mark-corona)" stroke-width="37.333"/>
  <circle cx="248" cy="258" r="150" fill="#12141F" mask="url(#clipse-mark-cutout)"/>
</svg>
