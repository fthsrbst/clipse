name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Signing is gated on secrets rather than assumed. A fork, or this repository
# before its certificates exist, still produces installable artefacts — they
# are simply unsigned, and the job says so instead of failing at the last step
# of a twenty-minute build.
jobs:
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/clipse-app/pnpm-lock.yaml

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev

      - name: Install frontend dependencies
        working-directory: apps/clipse-app
        run: pnpm install --frozen-lockfile

      - name: Report signing status
        id: signing
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && [ -n "${{ secrets.WINDOWS_CERTIFICATE }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ runner.os }}" = "macOS" ] && [ -n "${{ secrets.APPLE_CERTIFICATE }}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No signing credentials for ${{ runner.os }}; producing unsigned artefacts."
          fi

      # The daemon ships alongside the app: closing the window must not stop
      # syncing, so the installer needs both binaries.
      - name: Build the daemon
        run: cargo build --release -p clipsed --features clipse-store/encryption

      # Signing variables are *exported here*, not declared in `env:`.
      #
      # A GitHub `env:` entry whose secret is empty is still defined, as the
      # empty string — and Tauri's macOS bundler branches on whether
      # APPLE_CERTIFICATE is *set*, not on whether it has a value. So the
      # unsigned path, which is supposed to be the fallback, ran `security
      # import` with no certificate and failed the whole release at the last
      # step. Exporting only what is non-empty is what makes "unsigned" actually
      # mean unsigned.
      - name: Bundle the app
        working-directory: apps/clipse-app
        shell: bash
        run: |
          set -euo pipefail

          # Exported into *this* shell, not $GITHUB_ENV: that file only reaches
          # later steps, and the build runs here.
          export_if_set() {
            if [ -n "$2" ]; then
              export "$1=$2"
            fi
          }

          export_if_set TAURI_SIGNING_PRIVATE_KEY '${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}'
          export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD '${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}'
          export_if_set APPLE_CERTIFICATE '${{ secrets.APPLE_CERTIFICATE }}'
          export_if_set APPLE_CERTIFICATE_PASSWORD '${{ secrets.APPLE_CERTIFICATE_PASSWORD }}'
          export_if_set APPLE_SIGNING_IDENTITY '${{ secrets.APPLE_SIGNING_IDENTITY }}'
          export_if_set APPLE_ID '${{ secrets.APPLE_ID }}'
          export_if_set APPLE_PASSWORD '${{ secrets.APPLE_PASSWORD }}'
          export_if_set APPLE_TEAM_ID '${{ secrets.APPLE_TEAM_ID }}'

          # Without a Developer ID, Tauri signs nothing at all on macOS — and
          # "nothing" is worse than it sounds. The executable keeps the ad-hoc
          # signature the linker put there, the bundle around it gets no seal,
          # and `codesign --verify` fails with "code has no resources but
          # signature indicates they must be present". Gatekeeper renders that
          # as *"Clipse is damaged and can't be opened"*, which is the one
          # message that offers the user no way forward at all.
          #
          # Signing ad-hoc (identity `-`) produces a bundle that verifies. It
          # is still unnotarised, so a downloaded copy still has to be let
          # through once — but that path exists, and "damaged" has none.
          if [ "$RUNNER_OS" = "macOS" ] && [ -z "${APPLE_SIGNING_IDENTITY:-}" ]; then
            export APPLE_SIGNING_IDENTITY=-
            echo "::warning::No Developer ID; signing the macOS bundle ad-hoc (unnotarised)."
          fi

          # Tauri hands create-dmg `--skip-jenkins` whenever CI is set, and that
          # flag skips the AppleScript that writes the volume's `.DS_Store`.
          # Everything the installer window looks like — the background, the
          # icon positions, the window size — lives in that file, so every dmg
          # this workflow has published so far opened as a plain Finder window
          # carrying an unused background image. The runner does have a Finder
          # session; ask for the styling, and fall back to an unstyled dmg
          # rather than failing a release if the Finder script cannot run.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if ! TAURI_BUNDLER_DMG_IGNORE_CI=true pnpm tauri build; then
              echo "::warning::Finder styling failed; re-bundling the dmg without it."
              pnpm tauri build
            fi
          else
            pnpm tauri build
          fi

      # The portable build is the same executable the installer would place,
      # taken before it is wrapped: the app runs the daemon in its own process,
      # so one file is genuinely the whole product. It writes history to the
      # same per-user directory an installed copy uses — "portable" here means
      # "nothing to install", not "leaves no trace".
      #
      # It still needs the WebView2 runtime, which ships with Windows 10 22H2
      # and 11. The site says so next to the button.
      - name: Stage the portable executable
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/clipse-app/src-tauri/tauri.conf.json').version")
          mkdir -p portable
          cp target/release/clipse-app.exe "portable/Clipse_${version}_x64-portable.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: clipse-${{ matrix.artifact }}${{ steps.signing.outputs.signed == 'true' && '' || '-unsigned' }}
          path: |
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            portable/*.exe
            target/release/clipsed*
          if-no-files-found: error

  # Tagging used to produce artefacts you had to go and find in the Actions tab.
  # A tag is a release, so this makes one.
  publish:
    name: publish the release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artefacts

      - name: Attach the installers to the tag's release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # Matched by shape, not by "every .exe": the bare `clipsed.exe` is
          # uploaded as a build artefact for debugging and must not turn up on
          # the release page looking like something to download.
          mapfile -t files < <(find artefacts -type f \
            \( -name '*.msi' \
               -o -name '*setup.exe' \
               -o -name '*portable.exe' \
               -o -name '*.dmg' \
               -o -name '*.AppImage' \
               -o -name '*.deb' \) | sort)

          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no installers were produced"
            exit 1
          fi
          printf 'attaching %s\n' "${files[@]}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "Clipse ${tag#v}" --generate-notes
          fi
          gh release upload "$tag" "${files[@]}" --clobber
