name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev libwayland-dev xvfb

      # Clipboard integration tests need a display server on Linux.
      #
      # Deliberately not `--all-features`: that would switch clipse-store to
      # SQLCipher on every platform, which drags in an OpenSSL build and turns
      # a test job into a toolchain job. The encrypted path gets its own job
      # below. See docs/decisions.md.
      - name: Test (Linux, headless X)
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test --workspace

      - name: Test
        if: runner.os != 'Linux'
        run: cargo test --workspace

  encryption:
    name: store with SQLCipher
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install OpenSSL build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config
      # Release builds ship with this on, so it has to stay green even though
      # the default dev build does not use it.
      - run: cargo test -p clipse-store --features encryption

  cross-check:
    name: cross-check platform backends
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      # Type-checks the macOS and Windows clipboard backends from Linux. The
      # per-OS jobs above already build them natively; this one fails fast on
      # a pull request without waiting for the whole matrix.
      - run: cargo check --target aarch64-apple-darwin -p clipse-clipboard
      - run: cargo check --target x86_64-pc-windows-msvc -p clipse-clipboard

  notch:
    name: macOS notch sidecar
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # This is the only thing standing between the sidecar and nobody knowing
      # whether it compiles: it was written without a Mac, so CI is its first
      # reader. Whether the panel actually sits under the notch is a separate
      # question no build can answer.
      - name: Build ClipseNotch
        working-directory: apps/clipse-notch
        run: swift build -c release

  ui:
    name: ui smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/clipse-app/pnpm-lock.yaml
      - name: Skip until the Tauri app lands (F1)
        id: guard
        run: |
          if [ -f apps/clipse-app/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.guard.outputs.present == 'true'
        working-directory: apps/clipse-app
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm exec playwright install --with-deps chromium
          pnpm run test:e2e
