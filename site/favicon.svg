<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The corona of a total eclipse, on the void the whole product is set in.
       Not a crescent: that is a different event, and not the one Clipse is
       named after. -->
  <rect width="32" height="32" fill="#020806"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#FB3640" stroke-width="4.5"/>
</svg>
